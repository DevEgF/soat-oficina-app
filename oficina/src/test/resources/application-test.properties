spring.application.name=oficina-test

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina}

app.jwt.secret=test-jwt-secret-adequado-para-hs256-bytes
app.environment=hml
app.security.master.password=master
app.security.admin.password=admin
app.security.attendant.password=atendente
app.security.technician.password=tecnico
app.security.warehouse.password=almoxarife
