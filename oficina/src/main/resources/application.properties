spring.application.name=oficina

app.environment=${APP_ENVIRONMENT}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}
app.security.master.password=${APP_SECURITY_MASTER_PASSWORD}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.attendant.password=${APP_SECURITY_ATTENDANT_PASSWORD}
app.security.technician.password=${APP_SECURITY_TECHNICIAN_PASSWORD}
app.security.warehouse.password=${APP_SECURITY_WAREHOUSE_PASSWORD}
app.resend.api-key=${APP_RESEND_API_KEY:}
app.resend.from-email=${APP_RESEND_FROM_EMAIL:noreply@oficinasys.local}
app.resend.base-url=${APP_RESEND_BASE_URL:https://api.resend.com}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JPA/Hibernate — configuração padrão com PostgreSQL e schema versionado pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

# PostgreSQL local por padrão; pode ser sobrescrito por variáveis de ambiente.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina}
