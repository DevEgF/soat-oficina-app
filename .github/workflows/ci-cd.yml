name: app
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    name: app / backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U oficina" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x oficina/gradlew && ./oficina/gradlew -p oficina --no-daemon check bootJar
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oficina
          SPRING_DATASOURCE_USERNAME: oficina
          SPRING_DATASOURCE_PASSWORD: oficina
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backend-reports-${{ github.run_id }}
          path: oficina/build/reports
  image:
    name: app / image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U oficina" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --add-host host.docker.internal=host-gateway -t oficina:kind-test .
      - run: docker save oficina:kind-test -o image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-image-${{ github.run_id }}
          path: image.tar
          retention-days: 7
          if-no-files-found: error
  helm-smoke:
    name: app / helm-smoke
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: app-image-${{ github.run_id }}
      - run: docker load -i image.tar
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.1.4
      - uses: helm/kind-action@v1
        with:
          cluster_name: oficina-ci
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 deploy/helm/oficina/tests/render.py
      - run: helm lint deploy/helm/oficina --namespace hml -f deploy/helm/oficina/tests/fixture-values.yaml
      - run: pwsh -File scripts/test-workflows.ps1
      - run: pwsh -File scripts/test-delivery.ps1
      - run: pwsh -File scripts/test-evidence.ps1
      - run: |
          kind load docker-image oficina:kind-test --name oficina-ci
          kubectl create namespace hml
          kubectl -n hml apply -f scripts/kind-postgres.yaml
          kubectl -n hml rollout status deployment/postgres --timeout=180s
          helm upgrade --install oficina-hml deploy/helm/oficina --namespace hml -f scripts/kind-values.yaml --set demoFixtures.enabled=true --atomic --wait --timeout 10m
      - name: Smoke local health
        shell: pwsh
        run: |
          $forward = Start-Process kubectl -ArgumentList '-n','hml','port-forward','service/oficina-hml','18080:8080' -PassThru -RedirectStandardOutput /tmp/forward.log -RedirectStandardError /tmp/forward-error.log
          try { ./scripts/smoke-test.ps1 -ApiUrl http://localhost:18080 -AllowLocal } finally { Stop-Process -Id $forward.Id -ErrorAction SilentlyContinue }
      - name: Failure diagnostics
        if: failure()
        run: kubectl -n hml get pods,jobs,events
  security:
    name: app / security
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: app-image-${{ github.run_id }}
      - run: docker run --rm -v "$PWD:/scan:ro" aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --input /scan/image.tar --severity HIGH,CRITICAL --exit-code 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
