apiVersion: v1
kind: Service
metadata:
  name: {{ include "oficina.name" . }}
  labels:
    {{- include "oficina.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
