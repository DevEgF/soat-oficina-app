{{- if not .Values.local }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "oficina.revision" . }}
  labels:
    {{- include "oficina.labels" . | nindent 4 }}
    oficina.hook-resource: "true"
    oficina.revision: {{ .Release.Revision | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsRegion | quote }}
    usePodIdentity: "true"
    objects: |
      - objectName: {{ required "db.secretArn is required" .Values.db.secretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: spring.datasource.username
          - path: password
            objectAlias: spring.datasource.password
      - objectName: {{ required "jwt.secretArn is required" .Values.jwt.secretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: value
            objectAlias: app.jwt.secret
      - objectName: {{ required "staff.secretArn is required" .Values.staff.secretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          {{- range list "master" "admin" "attendant" "technician" "warehouse" }}
          - path: {{ . }}
            objectAlias: app.security.{{ . }}.password
          {{- end }}
{{- end }}
