apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oficina.revision" . }}-migrate
  labels:
    {{- include "oficina.labels" . | nindent 4 }}
    oficina.hook-resource: "true"
    oficina.revision: {{ .Release.Revision | quote }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 540
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "oficina.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ ternary "default" .Values.serviceAccount.name .Values.local }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          image: {{ include "oficina.image" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            {{- include "oficina.env" . | nindent 12 }}
            - name: APP_MIGRATION_ONLY
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "oficina.mounts" . | nindent 12 }}
      volumes:
        {{- include "oficina.volumes" . | nindent 8 }}
